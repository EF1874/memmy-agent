extends: electron-builder.win.yml

extraResources:
  - from: dist/runtime/bin
    to: cli
    filter:
      - "**/*"
  - from: build/icon.ico
    to: icon.ico
  - from: dist/native
    to: native
    filter:
      - "MemmyStoreUpdate.exe"

win:
  target:
    - target: appx
      arch:
        - x64

appx:
  artifactName: Memmy-${version}-${arch}.msix
  capabilities:
    - runFullTrust
  backgroundColor: transparent
  identityName: Memmy.Development
  applicationId: Memmy
  publisher: CN=Memmy Development
  publisherDisplayName: Memmy Development
  displayName: Memmy
  languages:
    - zh-CN
    - en-US
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  customManifestPath: build/appx-manifest.xml
  customExtensionsPath: build/appx-extensions.xml
